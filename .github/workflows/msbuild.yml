name: MSBuild

on:
  push:
    branches: [ "main" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed so we can compare commits to last release

    # ---------------------------
    # Determine if code changed
    # ---------------------------
    - name: Find latest tag
      id: get_latest_tag
      run: |
        $tag = git describe --tags --abbrev=0 2>$null
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Check if code changed since last release
      id: check_changes
      shell: pwsh
      run: |
        $tag = "${{ steps.get_latest_tag.outputs.tag }}"

        if ([string]::IsNullOrEmpty($tag)) {
            Write-Host "No previous tag → mark as changed."
            echo "changed=true" >> $env:GITHUB_OUTPUT
            exit 0
        }

        # Run git diff in CMD so its exit code doesn't break the step
        cmd /c "git diff --quiet $tag HEAD"
        $diffExit = $LASTEXITCODE

        if ($diffExit -eq 0) {
            Write-Host "No changes."
            echo "changed=false" >> $env:GITHUB_OUTPUT
        } elseif ($diffExit -eq 1) {
            Write-Host "Changes detected."
            echo "changed=true" >> $env:GITHUB_OUTPUT
        } else {
            Write-Host "git diff error code: $diffExit"
            echo "changed=true" >> $env:GITHUB_OUTPUT  # Fail gracefully
        }


    - name: Stop if no code changed
      if: steps.check_changes.outputs.changed == 'false'
      run: |
        Write-Host "No code changes since last release. Skipping release."
        exit 0

    # ---------------------------
    # Build
    # ---------------------------
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

    # ---------------------------
    # Collect built files
    # ---------------------------
    - name: Create artifact folder
      run: |
        New-Item -ItemType Directory -Path release -Force
        Get-ChildItem -Path . -Recurse -Filter Release -Directory |
          ForEach-Object {
            Get-ChildItem -Path $_.FullName -Recurse -File |
              Copy-Item -Destination release -Force
          }

    - name: Zip artifacts
      run: |
        Compress-Archive -Path release\* -DestinationPath build.zip -Force

    # ---------------------------
    # Create Release
    # ---------------------------
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: v0.0.${{ github.run_number }}
        release_name: Release v0.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build.zip
        asset_name: build.zip
        asset_content_type: application/zip
