name: MSBuild

on:
  push:
    branches: [ "main" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for git describe to find history

    # ---------------------------
    # Determine if code changed
    # ---------------------------
    - name: Check for changes
      id: check_changes
      shell: pwsh
      run: |
        # Try to find the latest tag. Suppress error if none exists.
        $tag = git describe --tags --abbrev=0 2>$null
        
        if (-not $tag) { 
            Write-Host "No tags found. Treating as first release."
            echo "changed=true" >> $env:GITHUB_OUTPUT
            exit 0
        }

        Write-Host "Latest tag found: $tag"
        
        # Check if there are commits between the tag and HEAD
        $diff = git diff --name-only $tag HEAD
        
        if ($diff) {
            Write-Host "Changes detected since $tag."
            echo "changed=true" >> $env:GITHUB_OUTPUT
        } else {
            Write-Host "No changes since $tag."
            echo "changed=false" >> $env:GITHUB_OUTPUT
        }

    # ---------------------------
    # Build (Only runs if changed)
    # ---------------------------
    - name: Setup NuGet
      if: steps.check_changes.outputs.changed == 'true'
      uses: NuGet/setup-nuget@v1.2.0

    - name: Add MSBuild to PATH
      if: steps.check_changes.outputs.changed == 'true'
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      if: steps.check_changes.outputs.changed == 'true'
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build
      if: steps.check_changes.outputs.changed == 'true'
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

    # ---------------------------
    # Collect built files
    # ---------------------------
    - name: Zip artifacts
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        New-Item -ItemType Directory -Path release_stage -Force
        
        # Find 'Release' folders, but EXCLUDE 'obj' folders to avoid intermediate files
        Get-ChildItem -Path . -Recurse -Filter "Release" -Directory | 
          Where-Object { $_.FullName -notmatch '\\obj\\' } |
          ForEach-Object {
            Write-Host "Copying files from: $($_.FullName)"
            Get-ChildItem -Path $_.FullName -Recurse -File | 
              Copy-Item -Destination release_stage -Force
          }

        Compress-Archive -Path release_stage\* -DestinationPath build.zip -Force

    # ---------------------------
    # Create Release
    # ---------------------------
    - name: Create Release
      if: steps.check_changes.outputs.changed == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.0.${{ github.run_number }}
        name: Release v0.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: build.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
